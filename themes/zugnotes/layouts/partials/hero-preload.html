{{/*
  hero-preload.html (§十一·七)
  Preload the cover image only on pages that actually render one.
  The only template that renders a cover is _default/single.html
  (.Params.image resolved as a page-bundle resource -> <figure class="article-cover">),
  so the condition here mirrors that block exactly.
  Home / list / taxonomy pages render no images at all, so they get no preload
  (a preload there downloads an image the visitor never sees).
  Insert before Google Fonts CSS link in head.html.
*/}}
{{ if .IsPage }}
  {{ with .Params.image }}
    {{ $imgRef := . }}
    {{ with $.Resources.GetMatch $imgRef }}
  <link rel="preload" as="image" href="{{ .RelPermalink }}" fetchpriority="high">
    {{ end }}
  {{ end }}
{{ end }}
